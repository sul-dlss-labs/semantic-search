name: Solr image

# No Docker image is published for Solr 10.1.0 yet, so build one from the
# release candidate's official Dockerfile and push it to GHCR for CI to use.
# Checksum and GPG verification still apply.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/solr-image.yml

env:
  SOLR_RC_URL: https://dist.apache.org/repos/dist/dev/solr/solr-10.1.0-RC2-rev-dfda5e1d4821958e60d13aa5ce3a0d4992319ed1/solr
  IMAGE: ghcr.io/${{ github.repository }}-solr:10.1.0-rc2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log into GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Solr image
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists; skipping build"
            exit 0
          fi
          curl --fail --silent --show-error --location "$SOLR_RC_URL/10.1.0/docker/Dockerfile.official-full" |
            docker build --tag "$IMAGE" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --build-arg SOLR_DOWNLOAD_SERVER="$SOLR_RC_URL" -
          docker push "$IMAGE"
