name: RSpec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Solr configuration
        uses: actions/checkout@v4
        with:
          repository: sul-dlss-labs/sdr-harvest
          path: sdr-harvest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: webapp

      - name: Start Solr
        run: |
          docker run --detach --name solr --publish 8983:8983 \
            --volume "${{ github.workspace }}/sdr-harvest/solr_configs:/opt/solr-config:ro" \
            solr:10 solr-precreate sdr-search /opt/solr-config
          if ! curl --retry 30 --retry-delay 2 --retry-all-errors \
            --fail --silent --show-error \
            http://127.0.0.1:8983/solr/sdr-search/admin/ping; then
            docker logs solr
            exit 1
          fi

      - name: Run RSpec
        working-directory: webapp
        env:
          RAILS_ENV: test
        run: bundle exec rspec
