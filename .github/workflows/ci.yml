name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: webapp

      - name: Scan for common Rails security vulnerabilities using static analysis
        working-directory: webapp
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        working-directory: webapp
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: webapp

      - name: Scan for security vulnerabilities in JavaScript dependencies
        working-directory: webapp
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: webapp/tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: webapp

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('webapp/.ruby-version', 'webapp/**/.rubocop.yml', 'webapp/**/.rubocop_todo.yml', 'webapp/Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        working-directory: webapp
        run: bin/rubocop -f github

  rspec:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out Solr configuration
        uses: actions/checkout@v7
        with:
          repository: sul-dlss-labs/sdr-harvest
          path: sdr-harvest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: webapp

      - name: Start Solr
        run: |
          docker run --detach --name solr --publish 8983:8983 \
            --volume "${{ github.workspace }}/sdr-harvest/solr_configs:/opt/solr-config:ro" \
            solr:10 solr-precreate sdr-search /opt/solr-config
          if ! curl --retry 30 --retry-delay 2 --retry-all-errors \
            --fail --silent --show-error \
            http://127.0.0.1:8983/solr/sdr-search/admin/ping; then
            docker logs solr
            exit 1
          fi

      - name: Run RSpec
        working-directory: webapp
        env:
          RAILS_ENV: test
        run: bundle exec rspec
